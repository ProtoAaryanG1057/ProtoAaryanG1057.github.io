<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FORM / FIELD — Redirecting</title>
    <script>
      // Single Page Apps for GitHub Pages redirect
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('./#' + (path.endsWith('/') ? '' : path) + (search || '') + (hash || ''));
    </script>
  </head>
  <body>
    <p>Redirecting to engineering portfolio...</p>
  </body>
</html>
